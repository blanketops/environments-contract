name: Release
on:
    push:
        tags:
            - "v*"
permissions:
    contents: write
jobs:
    release:
      # Zenith self-hosted pool. buf, mage, git-cliff and the protoc plugins are
      # baked into the runner toolchain image — no per-job tool setup.
      runs-on: self-hosted
      steps:
        - name: Generate GitHub App token
          id: app-token
          uses: actions/create-github-app-token@v3
          with:
            app-id: ${{ secrets.APP_ID }}
            private-key: ${{ secrets.APP_PRIVATE_KEY }}
            owner: blanketops
            repositories: environments-contract

        - name: Checkout
          uses: actions/checkout@v7
          with:
            fetch-depth: 0
            token: ${{ steps.app-token.outputs.token }}

        - name: Checkout main
          run: |
              git checkout main
              git pull origin main

        - name: Generate CHANGELOG.md
          run: git-cliff --config .cliff.toml --output CHANGELOG.md

        - name: Commit changelog
          run: |
              git config user.name "github-actions"
              git config user.email "actions@github.com"
              git add CHANGELOG.md
              git commit -m "chore(release): update changelog for ${{ github.ref_name }}" || echo "No changes"
              git push origin main

        - name: Generate release notes
          run: git-cliff --config .cliff.toml --latest --output RELEASE_NOTES.md

        # - name: Download generated contracts
        #   uses: dawidd6/action-download-artifact@v6
        #   with:
        #     github_token: ${{ secrets.GH_PAT }}
        #     repo: ntlaletsi70/blanketops-environments-contract
        #     workflow: generate.yml
        #     # Search for the most recent successful run regardless of SHA
        #     # This is much more reliable than trying to match the exact commit SHA
        #     workflow_search: true
        #     workflow_conclusion: success
        #     name: generated-contracts-latest
        #     path: ./dist
  
        - name: Create GitHub Release
          uses: softprops/action-gh-release@v3
          with:
            body_path: RELEASE_NOTES.md
          env:
            GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}


        - name: Release Summary
          run: |
              cat >> $GITHUB_STEP_SUMMARY <<EOF
              # 📦 GitHub Release Published

              **Version:** \`${{ github.ref_name }}\`

              ## Completed

              - Generated CHANGELOG.md using git-cliff
              - Committed changelog updates to main
              - Generated release notes
              - Published GitHub Release

              ## Artifacts

              - CHANGELOG.md
              - RELEASE_NOTES.md
              - GitHub Release

               ## Source Tag

               \`${{ github.ref_name }}\`

              EOF