# =============================================================================
# release.yml — Publish GitHub Release
#
# Triggers on version tags (v*). Generates contracts (buf gen via mage),
# changelog (git-cliff), and publishes a GitHub Release with artifacts attached.
#
# Assets attached to the release:
#   - generated-contracts-<tag>.tar.gz  (Go .pb.go + TypeScript _pb.ts)
#   - RELEASE_NOTES.md                   (git-cliff output for this version)
#
# Note: This repo does not generate CRDs — that is handled by environments repo.
#==============================================================================
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate contracts (Go + TypeScript)
        run: mage gen

      - name: Package generated contracts
        run: |
          tar -czf "generated-contracts-${{ github.ref_name }}.tar.gz" -C blanketops .

      - name: Generate release notes
        run: git-cliff --config .cliff.toml --latest --output RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: RELEASE_NOTES.md
          files: generated-contracts-${{ github.ref_name }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release Summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY <<EOF
          # 📦 GitHub Release Published

          **Version:** \`${{ github.ref_name }}\`

          ## Completed

          - Generated contracts (Go + TypeScript) via mage gen
          - Generated release notes via git-cliff
          - Published GitHub Release with assets

          ## Artifacts

          - generated-contracts-${{ github.ref_name }}.tar.gz (Go .pb.go + TypeScript _pb.ts)
          - RELEASE_NOTES.md (attached to release body)
          - GitHub Release

          ## Source Tag

          \`${{ github.ref_name }}\`

          EOF

      - name: Releaser complete
        if: always()
        uses: blanketops/environments-bots/.github/actions/releaser@v0.1.0
        with:
          command: complete
          release: ${{ github.ref_name }}
          app-id: ${{ secrets.DEVELOPER_APP_ID }}
          private-key: ${{ secrets.DEVELOPER_APP_PRIVATE_KEY }}
