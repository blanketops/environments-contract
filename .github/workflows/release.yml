# =============================================================================
# release.yml — Publish Secure GitHub Release & Contract Artifacts
#
# Triggers on version tags (v*). Generates contracts (buf gen via mage),
# changelog (git-cliff), SBOMs (without hitting artifact storage quotas),
# cryptographically signs via Sigstore/Cosign, issues GitHub build attestations,
# and publishes directly to GitHub Releases via the baked-in GitHub CLI (`gh`).
# =============================================================================
name: Release
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  id-token: write     # Required for Sigstore keyless OIDC signing
  attestations: write # Required for GitHub native build provenance attestations

jobs:
  release:
    runs-on: self-hosted
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_ID_PRIVATE_KEY }}
          owner: blanketops
          repositories: environments-api

      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Generate contracts (Go + TypeScript)
        run: mage gen

      - name: Package generated contracts
        run: |
          tar -czf "generated-contracts-${{ github.ref_name }}.tar.gz" -C blanketops .

      - name: Generate SBOM (Software Bill of Materials)
        uses: anchore/sbom-action@v0.24.3
        with:
          artifact-name: sbom-${{ github.ref_name }}.spdx.json
          output-file: sbom-${{ github.ref_name }}.spdx.json
          path: .
          format: spdx-json
          upload-artifact: false       # Bypasses GitHub internal artifact storage quota limits
          upload-release-assets: false # Assets are attached directly via gh below

      - name: Sign Artifacts with Sigstore Cosign (Keyless)
        run: |
          cosign sign-blob --yes \
            --output-signature generated-contracts-${{ github.ref_name }}.tar.gz.sig \
            generated-contracts-${{ github.ref_name }}.tar.gz

          cosign sign-blob --yes \
            --output-signature sbom-${{ github.ref_name }}.spdx.json.sig \
            sbom-${{ github.ref_name }}.spdx.json

      - name: Generate GitHub Native Artifact Attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            generated-contracts-${{ github.ref_name }}.tar.gz
            sbom-${{ github.ref_name }}.spdx.json

      - name: Generate release notes
        run: git-cliff --config .cliff.toml --latest --output RELEASE_NOTES.md

      - name: Create GitHub Release & Attach Assets via GitHub CLI (`gh`)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file RELEASE_NOTES.md \
            generated-contracts-${{ github.ref_name }}.tar.gz \
            generated-contracts-${{ github.ref_name }}.tar.gz.sig \
            sbom-${{ github.ref_name }}.spdx.json \
            sbom-${{ github.ref_name }}.spdx.json.sig \
            RELEASE_NOTES.md

      - name: Release Summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          # 📦 Secure GitHub Release Published

          **Version:** `${{ github.ref_name }}`

          ## Supply Chain Security & Verification
          - **Contracts Generated:** `generated-contracts-${{ github.ref_name }}.tar.gz`
          - **SBOM Generated:** `sbom-${{ github.ref_name }}.spdx.json` (Quota-safe local build)
          - **Sigstore Signatures:** Attached (`.sig` files) via keyless OIDC signing
          - **GitHub Provenance:** Native build attestations generated and verified
          - **Direct Upload:** Handled via baked-in GitHub CLI (`gh`)

          ## Attached Artifacts
          - `generated-contracts-${{ github.ref_name }}.tar.gz` (+ `.sig`)
          - `sbom-${{ github.ref_name }}.spdx.json` (+ `.sig`)
          - `RELEASE_NOTES.md`

          EOF

      - name: Releaser complete
        if: always()
        uses: blanketops/environments-bots/.github/actions/releaser@v0.1.0
        with:
          command: complete
          release: ${{ github.ref_name }}
          app-id: ${{ vars.DEVELOPER_CLIENT_ID }}
          private-key: ${{ secrets.DEVELOPER_APP_PRIVATE_KEY }}
