# Automated dependency updates. GitHub Actions only -- go.mod exists for
# the generated Go code's module path but declares no dependencies (pure
# generated output, nothing for gomod-ecosystem Dependabot to track), so
# github-actions (workflow action version pins) is the only ecosystem that
# applies here. PRs target main, so dependency updates land on main
# directly; develop takes them in the next sync from main.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "dependencies"
      - "ci"
